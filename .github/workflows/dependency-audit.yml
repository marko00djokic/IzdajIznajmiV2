name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  push:
    branches: [main]
    paths:
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: Composer production dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev --format=plain

  npm:
    name: npm production dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit locked production dependencies
        run: npm audit --audit-level=high --omit=dev --package-lock-only
