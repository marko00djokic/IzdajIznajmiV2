name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      BRANCH: ${{ secrets.PROD_BRANCH || 'main' }}
      HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "SSH_KEY or SSH_HOST not set; skipping SSH setup."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          echo "$SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        shell: bash
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.DEPLOY_PATH != '' && env.SSH_KEY != ''
        run: |
          BRANCH_VALUE="${BRANCH:-main}"
          HEALTH="${HEALTH_URL:-http://127.0.0.1/api/v1/health}"

          ssh "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd \"$DEPLOY_PATH\"; git fetch origin \"$BRANCH_VALUE\"; git checkout \"$BRANCH_VALUE\"; git pull origin \"$BRANCH_VALUE\"; ENVIRONMENT=production HEALTH_URL=\"$HEALTH\" ./ops/deploy.sh"
